name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go test -shuffle=on ./...
        if: runner.os != 'Windows'
      - name: Run tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = (& go test -shuffle=on ./... 2>&1 | Out-String)
          $exitCode = $LASTEXITCODE
          Write-Output $output
          if ($exitCode -ne 0) {
            $annotation = $output.Replace("%", "%25").Replace("`r", "").Replace("`n", "%0A")
            Write-Output "::error title=Windows tests::$annotation"
            exit $exitCode
          }
      - run: CGO_ENABLED=1 go test -race -shuffle=on ./...
        if: runner.os != 'Windows'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  performance:
    name: Performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check project model budget
        env:
          PAWNKIT_PERFORMANCE_BUDGET: "1"
        run: go test -count=1 -run '^TestSharedCompactIncludeContextPerformanceBudget$' ./pkg/project

  benchmarks:
    name: benchmark history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Benchmark head
        run: go test -run '^$' -bench '^BenchmarkRules$' -benchmem -benchtime=1x -count=6 ./internal/bench | tee benchmark-head.txt
      - name: Benchmark pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/pawnlint-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/pawnlint-base"
          go test -run '^$' -bench '^BenchmarkRules$' -benchmem -benchtime=1x -count=6 ./internal/bench | tee benchmark-base.txt
      - name: Compare pull request benchmark
        if: github.event_name == 'pull_request'
        run: |
          go run golang.org/x/perf/cmd/benchstat@v0.0.0-20260709024250-82a0b07e230d \
            "$RUNNER_TEMP/pawnlint-base/benchmark-base.txt" benchmark-head.txt | tee benchmark-comparison.txt
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pawnlint-benchmarks
          path: benchmark-*.txt
          if-no-files-found: warn

  corpus:
    name: Corpus conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out pawnlint
        uses: actions/checkout@v7
        with:
          path: pawnlint
      - name: Check out pawn-corpus
        uses: actions/checkout@v7
        with:
          repository: pawnkit/pawn-corpus
          ref: 43cee425a3a528d1b71d4e2a24eb250b7df62d59
          path: pawn-corpus
      - uses: actions/setup-go@v6
        with:
          go-version-file: pawnlint/go.mod
      - name: Run corpus-backed tests
        working-directory: pawnlint
        env:
          PAWN_CORPUS_DIR: ${{ github.workspace }}/pawn-corpus
        run: go test -count=1 ./...

  real-projects:
    name: Pinned real projects
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pawnlint
        uses: actions/checkout@v7
        with:
          path: pawnlint
      - name: Check out pawn-corpus
        uses: actions/checkout@v7
        with:
          repository: pawnkit/pawn-corpus
          ref: v0.1.15
          path: pawn-corpus
      - uses: actions/setup-go@v6
        with:
          go-version-file: pawnlint/go.mod
      - name: Install report tools
        run: sudo apt-get update && sudo apt-get install -y jq time
      - name: Install sampctl 1.14.0
        run: |
          go install github.com/Southclaws/sampctl/src@44ae84d1ca91962c1c3168e5b216c25ba035e9d9
          mv "$(go env GOPATH)/bin/src" "$(go env GOPATH)/bin/sampctl"
      - name: Fetch pinned projects
        working-directory: pawnlint
        env:
          PAWN_CORPUS_DIR: ${{ github.workspace }}/pawn-corpus
        run: scripts/prepare-realworld.sh "$RUNNER_TEMP/pawnlint-corpus"
      - name: Install declared dependencies
        working-directory: pawnlint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAWN_CORPUS_DIR: ${{ github.workspace }}/pawn-corpus
        run: scripts/ensure-realworld.sh "$RUNNER_TEMP/pawnlint-corpus"
      - name: Run real-project suite
        working-directory: pawnlint
        env:
          PAWN_CORPUS_DIR: ${{ github.workspace }}/pawn-corpus
        run: scripts/realworld-bench.sh "$RUNNER_TEMP/pawnlint-corpus" "$RUNNER_TEMP/pawnlint-results"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pawnlint-real-project-results
          path: ${{ runner.temp }}/pawnlint-results/*.json

  build:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  fuzz-smoke:
    name: Fuzz smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./internal/source/walk -run=^$ -fuzz=FuzzWalk -fuzztime=30s
      - run: go test ./pkg/lint/suppress -run=^$ -fuzz=FuzzSuppression -fuzztime=30s
      - run: go test ./internal/semantic -run=^$ -fuzz=FuzzBuild -fuzztime=30s
      - run: go test ./pkg/rules/correctness -run=^$ -fuzz=FuzzMalformed -fuzztime=30s

  release-check:
    name: Release snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.12.7
          args: release --snapshot --clean

  support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: pawnkit/pawn-actions/support-check@v1.8.72
        with:
          repository: pawnkit/pawnlint
          targets: linux-amd64,windows-amd64,darwin-arm64
